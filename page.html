<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargando...</title>

<style id="baseStyle">
  *{box-sizing:border-box;}
  body{margin:0;font-family:Inter,sans-serif;background:#11141a;color:#eef0f4;}
  #loadingMsg{min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:15px;color:#8c92a4;text-align:center;padding:24px;}
</style>

<body>

<div id="loadingMsg">Cargando página...</div>

<div id="pageRoot" style="display:none">
  <header class="hero">
    <img id="siteLogo" class="site-logo" alt="logo">
    <h1 id="siteName">Tu negocio</h1>
    <p id="siteTagline" style="display:none"></p>
    <div class="social-row" id="socialRow"></div>
  </header>
  <div class="cat-filter" id="catFilter"></div>
  <main class="catalog" id="catalogWrap"></main>
  <footer>Página generada con Impulso Digital<br><button class="admin-link" onclick="openAdminLogin()">Panel del negocio</button></footer>

  <div class="cart-bar" id="cartBar" style="display:none">
    <span id="cartSummary">0 items · $0</span>
    <button onclick="openCart()" id="cartOpenBtn">Tu pedido</button>
  </div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-panel">
      <button class="close-cart" onclick="closeCart()">Cerrar</button>
      <h3 id="cartTitleEl">Tu pedido</h3>
      <div id="cartLines"></div>
      <div class="cart-total"><span>Total</span><span id="cartTotalVal">$0</span></div>
      <button class="wa-send" onclick="sendWA()" id="sendWaBtn">Enviar pedido por WhatsApp</button>
    </div>
  </div>

  <div class="modal-ov" id="adminLoginModal">
    <div class="modal-box">
      <button class="close-cart" onclick="closeAdminLogin()">Cerrar</button>
      <h3>Acceso del negocio</h3>
      <div class="f-a"><label>Usuario</label><input id="admU"></div>
      <div class="f-a"><label>Contraseña</label><input id="admP" type="password"></div>
      <button class="wa-send" onclick="tryAdminLogin()">Entrar</button>
      <p class="err-msg" id="admErr">Usuario o contraseña incorrectos.</p>
    </div>
  </div>

  <div class="modal-ov" id="adminHubModal">
    <div class="modal-box">
      <button class="close-cart" onclick="closeAdminHub()">Cerrar</button>
      <h3 id="hubTitle">Panel de tu negocio</h3>
      <button class="hub-btn" onclick="openAdminBiz()">Datos del negocio (logo, textos, WhatsApp, redes)</button>
      <button class="hub-btn" onclick="openCatalog()" id="hubCatalogBtn">Catálogo</button>
      <button class="hub-btn" onclick="closeAdminHub()">Cerrar sesión</button>
    </div>
  </div>

  <div class="modal-ov" id="adminBizModal">
    <div class="modal-box">
      <button class="close-cart" onclick="closeAdminBiz()">Volver</button>
      <h3>Datos del negocio</h3>
      <img id="logoPreview" class="logo-preview" alt="logo">
      <input type="hidden" id="logoValue">
      <div class="f-a"><label>Subir logo (imagen)</label><input type="file" accept="image/*" onchange="onLogoFile(this)"></div>
      <div class="f-a"><label>o pegar URL del logo</label><input id="edLogoUrl" oninput="onLogoUrl(this.value)" placeholder="https://..."></div>
      <div class="f-a"><label>Nombre del negocio</label><input id="edName"></div>
      <div class="f-a"><label>Texto / frase corta</label><input id="edTagline"></div>
      <div class="f-a"><label>Correo electrónico</label><input id="edEmail"></div>
      <div class="f-a"><label>WhatsApp (con código de país, sin +)</label><input id="edWhats"></div>
      <div class="f-a"><label>Instagram (usuario)</label><input id="edInsta"></div>
      <div class="f-a"><label>Facebook (usuario o página)</label><input id="edFb"></div>
      <div class="f-a"><label>TikTok (usuario)</label><input id="edTiktok"></div>
      <button class="wa-send" onclick="saveBizEdits()">Guardar cambios</button>
    </div>
  </div>

  <div class="modal-ov" id="catalogModal">
    <div class="modal-box">
      <button class="close-cart" onclick="closeCatalog()">Volver</button>
      <h3>Categorías</h3>
      <div class="cat-manage" id="catManageList"></div>
      <div class="cat-add-row"><input id="newCatInput" placeholder="Nueva categoría"><button onclick="addCategory()">Agregar</button></div>
      <h3 id="catalogListTitle">Tus productos</h3>
      <div id="prodList"></div>
      <button class="wa-send" onclick="openItemForm(null)" id="addItemBtn">+ Agregar</button>
    </div>
  </div>

  <div class="modal-ov" id="itemFormModal">
    <div class="modal-box">
      <button class="close-cart" onclick="closeItemForm()">Cerrar</button>
      <h3 id="itemFormTitle">Nuevo</h3>
      <div class="f-a"><label>Nombre</label><input id="itName"></div>
      <div class="f-a"><label>Categoría</label><select id="itCatSelect" onchange="onItCatChange()"></select></div>
      <div class="f-a" id="itNewCatWrap" style="display:none"><label>Nombre de la nueva categoría</label><input id="itNewCat"></div>
      <div class="f-a"><label>Precio (ARS)</label><input id="itPrice" type="number"></div>
      <div class="f-a"><label>Descripción</label><textarea id="itDesc"></textarea></div>
      <div class="f-a"><label>Imágenes</label>
        <div class="img-thumbs" id="itImgThumbs"></div>
        <input type="file" accept="image/*" onchange="onItemImageFile(this)">
        <div class="url-add-row"><input id="itImgUrl" placeholder="https://... URL de imagen"><button onclick="addItemImageUrl()">Agregar</button></div>
      </div>
      <button class="wa-send" onclick="saveItemForm()">Guardar</button>
    </div>
  </div>
</div>

function buildCSS(tpl){
  var v = tpl.vars;
  return (
    ':root{--bg:' + v.bg + ';--surface:' + v.surface + ';--text:' + v.text + ';--muted:' + v.muted +
    ';--accent:' + v.accent + ';--accent2:' + v.accent2 + ';--radius:' + v.radius + ';}' +
    'body{background:var(--bg);color:var(--text);font-family:' + v.fontBody + ';padding-bottom:86px;}' +
    'h1,h2,h3{font-family:' + v.fontHead + ';margin:0;}' +
    'a{color:inherit;}' +
    '.hero{padding:38px 22px 20px;text-align:' + (tpl.layout==='split' ? 'left' : 'center') + ';}' +
    '.hero h1{font-size:30px;line-height:1.15;}' +
    '.site-logo{max-width:96px;max-height:96px;object-fit:contain;margin:0 auto 12px;display:none;}' +
    '.social-row{display:flex;gap:12px;margin-top:16px;justify-content:' + (tpl.layout==='split' ? 'flex-start' : 'center') + ';flex-wrap:wrap;}' +
    '.social-row a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--accent);font-size:13px;text-decoration:none;color:var(--text);}' +
    '.cat-filter{max-width:1080px;margin:0 auto;padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:' + (tpl.layout==='split' ? 'flex-start' : 'center') + ';}' +
    '.cat-chip{border:1px solid var(--accent);border-radius:999px;padding:7px 14px;font-size:12.5px;background:transparent;color:var(--text);}' +
    '.cat-chip.active{background:var(--accent);color:var(--bg);}' +
    '.catalog{max-width:1080px;margin:0 auto;padding:0 16px;display:grid;gap:18px;' +
      (tpl.layout==='grid' ? 'grid-template-columns:repeat(auto-fit,minmax(260px,1fr));' : 'grid-template-columns:1fr;') + '}' +
    '.item-card{background:var(--surface);border:' + v.cardBorder + ';border-radius:var(--radius);overflow:hidden;display:' + (tpl.layout==='split' ? 'grid' : 'block') + ';' +
      (tpl.layout==='split' ? 'grid-template-columns:1fr 1fr;' : '') + '}' +
    '.item-card .cat-tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--muted);border-radius:999px;padding:2px 9px;margin-bottom:6px;}' +
    '.carousel{position:relative;background:#00000010;aspect-ratio:4/3;overflow:hidden;}' +
    '.carousel img{width:100%;height:100%;object-fit:cover;display:none;}' +
    '.carousel img.active{display:block;}' +
    '.carousel .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;}' +
    '.car-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;border:none;width:30px;height:30px;border-radius:50%;font-size:15px;}' +
    '.car-prev{left:8px;} .car-next{right:8px;}' +
    '.car-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;gap:6px;justify-content:center;}' +
    '.car-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);}' +
    '.car-dots span.active{background:#fff;}' +
    '.item-body{padding:18px;display:flex;flex-direction:column;gap:6px;}' +
    '.item-body h3{font-size:18px;}' +
    '.item-body .desc{color:var(--muted);font-size:14px;line-height:1.5;}' +
    '.item-body .price{font-size:20px;font-weight:700;color:var(--accent);margin-top:4px;}' +
    '.qty-row{display:flex;align-items:center;gap:10px;margin-top:8px;}' +
    '.qty-row button{width:30px;height:30px;border-radius:8px;border:1px solid var(--muted);background:transparent;color:var(--text);font-size:16px;}' +
    '.add-btn{margin-top:10px;background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:11px 16px;font-weight:700;font-size:14px;}' +
    '.empty-cat{max-width:1080px;margin:0 auto;padding:30px 16px;text-align:center;color:var(--muted);font-size:14px;}' +
    'footer{max-width:1080px;margin:34px auto 0;padding:20px 16px;text-align:center;color:var(--muted);font-size:12px;}' +
    '.cart-bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:' + v.cardBorder + ';padding:12px 18px;display:flex;align-items:center;justify-content:space-between;font-size:14px;}' +
    '.cart-bar button{background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:9px 16px;font-weight:700;}' +
    '.cart-drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;}' +
    '.cart-drawer.open{display:flex;}' +
    '.cart-panel{background:var(--surface);color:var(--text);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px;max-height:80vh;overflow:auto;}' +
    '.cart-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(128,128,128,.25);font-size:14px;}' +
    '.cart-total{display:flex;justify-content:space-between;font-weight:700;padding:14px 0;font-size:16px;}' +
    '.close-cart{background:transparent;border:none;color:var(--muted);font-size:14px;float:right;}' +
    '.wa-send{width:100%;background:var(--accent2);color:#062;border:none;border-radius:8px;padding:13px;font-weight:700;font-size:15px;margin-top:10px;}' +
    '.admin-link{background:none;border:none;color:var(--muted);font-size:11px;text-decoration:underline;cursor:pointer;padding:6px 0;margin-top:4px;}' +
    '.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:70;padding:16px;}' +
    '.modal-ov.open{display:flex;}' +
    '.modal-box{background:var(--surface);color:var(--text);border-radius:14px;padding:22px;max-width:460px;width:100%;max-height:85vh;overflow:auto;}' +
    '.modal-box h3{font-size:17px;margin-bottom:14px;}' +
    '.f-a{margin-bottom:12px;}' +
    '.f-a label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}' +
    '.f-a input,.f-a select,.f-a textarea{width:100%;padding:9px 10px;border-radius:8px;border:1px solid rgba(128,128,128,.4);background:transparent;color:var(--text);font-size:14px;}' +
    '.f-a textarea{min-height:60px;resize:vertical;}' +
    '.logo-preview{max-width:110px;max-height:110px;display:none;border-radius:8px;margin-bottom:10px;object-fit:contain;}' +
    '.err-msg{color:#ff6b6b;font-size:12.5px;margin-top:8px;display:none;}' +
    '.hub-btn{width:100%;text-align:left;background:transparent;border:1px solid rgba(128,128,128,.4);color:var(--text);border-radius:10px;padding:13px 14px;font-size:14px;margin-bottom:10px;}' +
    '.cat-manage{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}' +
    '.cat-manage span{border:1px solid rgba(128,128,128,.4);border-radius:999px;padding:5px 11px;font-size:12px;}' +
    '.cat-add-row{display:flex;gap:8px;margin-bottom:16px;}' +
    '.cat-add-row input{flex:1;}' +
    '.cat-add-row button{flex:none;background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:0 14px;font-weight:700;}' +
    '.prod-row{display:flex;gap:10px;align-items:center;border:1px solid rgba(128,128,128,.25);border-radius:10px;padding:10px;margin-bottom:8px;}' +
    '.prod-row img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#00000015;}' +
    '.prod-row .pr-info{flex:1;min-width:0;}' +
    '.prod-row .pr-info b{display:block;font-size:13.5px;}' +
    '.prod-row .pr-info small{color:var(--muted);font-size:11.5px;}' +
    '.prod-row .pr-actions{display:flex;gap:6px;}' +
    '.prod-row .pr-actions button{border:none;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;}' +
    '.img-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}' +
    '.img-thumbs .th{position:relative;width:56px;height:56px;}' +
    '.img-thumbs .th img{width:100%;height:100%;object-fit:cover;border-radius:6px;}' +
    '.img-thumbs .th button{position:absolute;top:-6px;right:-6px;background:#ff5b5b;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;}' +
    '.url-add-row{display:flex;gap:8px;margin-top:6px;}' +
    '.url-add-row input{flex:1;}' +
    '.url-add-row button{flex:none;background:transparent;border:1px solid var(--accent);color:var(--text);border-radius:8px;padding:0 12px;}'
  );
}

/* ================= arranque ================= */
var API_URL = window.location.origin + '/.netlify/functions/site';
var params = new URLSearchParams(window.location.search);
var SITE_ID = params.get('id');

var remote = {};
var sessionUser = null, sessionPass = null;
var activeCat = '__all__';
var editingImages = [];
var editingItemId = null;
var qty = {}, cart = {}, carIndex = {};

function effective(field){ var v = remote[field]; return (v !== undefined && v !== '') ? v : ''; }
function effectiveItems(){ return Array.isArray(remote.items) ? remote.items : []; }
function effectiveCategorie
