    </div>
  </div>

  <div class="modal-ov" id="adminLoginModal">

    </div>
  </div>

  <div class="modal-ov" id="adminBizModal">
    <div class="modal-box">
      <button class="close-cart" onclick="closeAdminBiz()">Volver</button>

      <img id="logoPreview" class="logo-preview" alt="logo">
      <input type="hidden" id="logoValue">
      <div class="f-a"><label>Subir logo (imagen)</label><input type="file" accept="image/*" onchange="onLogoFile(this)"></div>
      <div class="f-a"><label>o pegar URL del logo</label><input id="edLogoUrl" oninput="onLogoUrl(this.value)" placeholder="https://..."></div>
      <div class="f-a"><label>Nombre del negocio</label><input id="edName"></div>
      <div class="f-a"><label>Texto / frase corta</label><input id="edTagline"></div>
      <div class="f-a"><label>Correo electrónico</label><input id="edEmail"></div>
      <div class="f-a"><label>WhatsApp (con código de país, sin +)</label><input id="edWhats"></div>
      <div class="f-a"><label>Instagram (usuario)</label><input id="edInsta"></div>
      <div class="f-a"><label>Facebook (usuario o página)</label><input id="edFb"></div>
      <div class="f-a"><label>TikTok (usuario)</label><input id="edTiktok"></div>
      <button class="wa-send" onclick="saveBizEdits()">Guardar cambios</button>
    </div>
  </div>

  <div class="modal-ov" id="catalogModal">
    <div class="modal-box">
      <button class="close-cart" onclick="closeCatalog()">Volver</button>
      <h3>Categorías</h3>
      <div class="cat-manage" id="catManageList"></div>
      <div class="cat-add-row"><input id="newCatInput" placeholder="Nueva categoría"><button onclick="addCategory()">Agregar</button></div>
      <h3 id="catalogListTitle">Tus productos</h3>
      <div id="prodList"></div>
      <button class="wa-send" onclick="openItemForm(null)" id="addItemBtn">+ Agregar</button>
    </div>
  </div>

  <div class="modal-ov" id="itemFormModal">
    <div class="modal-box">
      <button class="close-cart" onclick="closeItemForm()">Cerrar</button>
      <h3 id="itemFormTitle">Nuevo</h3>

      <div class="f-a"><label>Categoría</label><select id="itCatSelect" onchange="onItCatChange()"></select></div>
      <div class="f-a" id="itNewCatWrap" style="display:none"><label>Nombre de la nueva categoría</label><input id="itNewCat"></div>
      <div class="f-a"><label>Precio (ARS)</label><input id="itPrice" type="number"></div>
      <div class="f-a"><label>Descripción</label><textarea id="itDesc"></textarea></div>
      <div class="f-a"><label>Imágenes</label>

      </div>
      <button class="wa-send" onclick="saveItemForm()">Guardar</button>
    </div>
  </div>

function buildCSS(tpl){
  var v = tpl.vars;
  return (

    ';--accent:' + v.accent + ';--accent2:' + v.accent2 + ';--radius:' + v.radius + ';}' +
    'body{background:var(--bg);color:var(--text);font-family:' + v.fontBody + ';padding-bottom:86px;}' +
    'h1,h2,h3{font-family:' + v.fontHead + ';margin:0;}' +
    'a{color:inherit;}' +

    '.cat-chip.active{background:var(--accent);color:var(--bg);}' +

/* ================= arranque ================= */
var API_URL = window.location.origin + '/.netlify/functions/site';
var params = new URLSearchParams(window.location.search);
var SITE_ID = params.get('id');

var remote = {};
var sessionUser = null, sessionPass = null;
var activeCat = '__all__';
var editingImages = [];
var editingItemId = null;
var qty = {}, cart = {}, carIndex = {};

function effective(field){ var v = remote[field]; return (v !== undefined && v !== '') ? v : ''; }
function effectiveItems(){ return Array.isArray(remote.items) ? remote.items : []; }
function effectiveCategories(){ return (Array.isArray(remote.categories) && remote.categories.length) ? remote.categories : ['Productos']; }
function isService(){ return remote.pageType === 'servicio'; }
function itemLabel(){ return isService() ? 'servicio' : 'producto'; }

function escHtml(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function formatMoney(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

async function init(){
  if(!SITE_ID){
    document.getElementById('loadingMsg').textContent = 'Falta el identificador de la página en el link.';
    return;
  }
  try{
    var res = await fetch(API_URL + '?id=' + encodeURIComponent(SITE_ID));
    var json = await res.json();
    if(!json.found){
      document.getElementById('loadingMsg').textContent = 'Esta página todavía no existe o fue eliminada.';
      return;
    }
    remote = json.data || {};
  }catch(e){
    document.getElementById('loadingMsg').textContent = 'No se pudo cargar la página. Probá de nuevo en un momento.';
    return;
  }

  var tpl = TEMPLATES.find(function(t){ return t.id === (remote.template || 1); }) || TEMPLATES[0];
  document.getElementById('tplStyle').textContent = buildCSS(tpl);
  document.title = remote.businessName || 'Página';

  var svc = isService();
  document.getElementById('cartOpenBtn').textContent = svc ? 'Tu reserva' : 'Tu pedido';
  document.getElementById('cartTitleEl').textContent = svc ? 'Tu reserva' : 'Tu pedido';
  document.getElementById('sendWaBtn').textContent = svc ? 'Confirmar reserva por WhatsApp' : 'Enviar pedido por WhatsApp';
  document.getElementById('catalogListTitle').textContent = svc ? 'Tus servicios' : 'Tus productos';
  document.getElementById('addItemBtn').textContent = '+ Agregar ' + itemLabel();
  document.getElementById('hubCatalogBtn').textContent = 'Catálogo (' + itemLabel() + 's y categorías)';

  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('pageRoot').style.display = 'block';

  applyData();
  renderCatalog();
}

function applyData(){
  document.getElementById('siteName').textContent = effective('businessName') || 'Tu negocio';
  var tEl = document.getElementById('siteTagline'); var tag = effective('tagline');
  if(tag){ tEl.textContent = tag; tEl.style.cssText = 'margin-top:8px;font-size:15px;color:var(--muted);'; } else { tEl.style.display = 'none'; }
  var logoEl = document.getElementById('siteLogo'); var logo = effective('logo');
  if(logo){ logoEl.src = logo; logoEl.style.display = 'block'; } else { logoEl.style.display = 'none'; }
  var soc = [];
  var ig = effective('instagram'); if(ig) soc.push('<a href="https://instagram.com/' + ig + '" target="_blank">Instagram</a>');
  var fb = effective('facebook'); if(fb) soc.push('<a href="https://facebook.com/' + fb + '" target="_blank">Facebook</a>');
  var tk = effective('tiktok'); if(tk) soc.push('<a href="https://tiktok.com/@' + tk + '" target="_blank">TikTok</a>');
  var wa = effective('whatsapp'); if(wa) soc.push('<a href="https://wa.me/' + wa + '" target="_blank">WhatsApp</a>');
  var em = effective('email'); if(em) soc.push('<a href="mailto:' + em + '">Email</a>');
  document.getElementById('socialRow').innerHTML = soc.join('');
}

function renderCatFilter(){
  var cats = effectiveCategories();
  var html = '<button class="cat-chip' + (activeCat === '__all__' ? ' active' : '') + '" onclick="setActiveCat(\'__all__\')">Todos</button>';
  cats.forEach(function(c){ html += '<button class="cat-chip' + (activeCat === c ? ' active' : '') + '" onclick="setActiveCat(\'' + c.replace(/'/g,'') + '\')">' + c + '</button>'; });
  document.getElementById('catFilter').innerHTML = html;
}
function setActiveCat(c){ activeCat = c; renderCatFilter(); renderCatalog(); }

function renderCatalog(){
  renderCatFilter();
  var items = effectiveItems().filter(function(it){ return activeCat === '__all__' || it.category === activeCat; });
  var wrap = document.getElementById('catalogWrap');
  if(!items.length){ wrap.innerHTML = '<p class="empty-cat">Todavía no hay nada cargado acá.</p>'; return; }
  wrap.innerHTML = items.map(renderItemCard).join('');
  items.forEach(function(it){ if(!(it.id in qty)) qty[it.id] = 1; if(!(it.id in carIndex)) carIndex[it.id] = 0; });
}

function renderItemCard(it){
  var imgs = it.images || [];
  var imagesHtml = imgs.length ? imgs.map(function(src,i){ return '<img src="' + src.replace(/"/g,'&quot;') + '" class="' + (i===0?'active':'') + '" data-idx="' + i + '">'; }).join('') : '<div class="noimg">Sin imagen</div>';
  var dotsHtml = imgs.length > 1 ? '<div class="car-dots">' + imgs.map(function(_,i){ return '<span class="' + (i===0?'active':'') + '" data-dot="' + i + '"></span>'; }).join('') + '</div>' : '';
  var arrowsHtml = imgs.length > 1 ? '<button class="car-btn car-prev" onclick="carMove(\'' + it.id + '\',-1)">&#8249;</button><button class="car-btn car-next" onclick="carMove(\'' + it.id + '\',1)">&#8250;</button>' : '';
  return '<div class="item-card"><div class="carousel" id="car-' + it.id + '">' + imagesHtml + arrowsHtml + dotsHtml + '</div>' +
    '<div class="item-body">' +
    (it.category ? '<span class="cat-tag">' + it.category + '</span>' : '') +
    '<h3>' + escHtml(it.name) + '</h3>' +
    (it.desc ? '<p class="desc">' + escHtml(it.desc) + '</p>' : '') +
    '<p class="price">$' + formatMoney(it.price) + '</p>' +
    '<div class="qty-row"><button onclick="qtyChange(\'' + it.id + '\',-1)">-</button><span id="qty-' + it.id + '">' + (qty[it.id]||1) + '</span><button onclick="qtyChange(\'' + it.id + '\',1)">+</button></div>' +
    '<button class="add-btn" onclick="addToCart(\'' + it.id + '\')">' + (isService() ? 'Reservar' : 'Agregar al carrito') + '</button>' +
    '</div></div>';
}

function qtyChange(id, delta){ var n = (qty[id]||1) + delta; if(n < 1) n = 1; qty[id] = n; var el = document.getElementById('qty-' + id); if(el) el.textContent = n; }
function addToCart(id){ var it = effectiveItems().find(function(x){ return x.id === id; }); if(!it) return; var line = cart[id] || {name: it.name, price: it.price, qty: 0}; line.qty += (qty[id]||1); cart[id] = line; updateCartBar(); }
function updateCartBar(){
  var count = 0, total = 0;
  Object.keys(cart).forEach(function(k){ count += cart[k].qty; total += cart[k].qty * cart[k].price; });
  var bar = document.getElementById('cartBar');
  bar.style.display = count > 0 ? 'flex' : 'none';
  document.getElementById('cartSummary').textContent = count + ' items · $' + formatMoney(total);
}
function openCart(){
  var wrap = document.getElementById('cartLines'); wrap.innerHTML = ''; var total = 0;
  Object.keys(cart).forEach(function(k){ var l = cart[k]; total += l.qty * l.price; var div = document.createElement('div'); div.className = 'cart-line'; div.textContent = l.name + ' x' + l.qty + ' — $' + formatMoney(l.qty * l.price); wrap.appendChild(div); });
  document.getElementById('cartTotalVal').textContent = '$' + formatMoney(total);
  document.getElementById('cartDrawer').classList.add('open');
}
function closeCart(){ document.getElementById('cartDrawer').classList.remove('open'); }
function sendWA(){
  var lines = [], total = 0;
  Object.keys(cart).forEach(function(k){ var l = cart[k]; total += l.qty * l.price; lines.push('- ' + l.name + ' x' + l.qty + ' = $' + formatMoney(l.qty*l.price)); });
  if(lines.length === 0){ alert('Todavia no agregaste nada.'); return; }
  var msg = 'Hola! Quiero hacer este ' + (isService() ? 'reserva' : 'pedido') + ' en ' + effective('businessName') + ':\n' + lines.join('\n') + '\nTotal: $' + formatMoney(total);
  var url = 'https://wa.me/' + effective('whatsapp') + '?text=' + encodeURIComponent(msg);
  window.open(url, '_blank');
}
function carMove(id, delta){
  var it = effectiveItems().find(function(x){ return x.id === id; }); if(!it || !it.images || it.images.length < 2) return;
  var n = it.images.length; carIndex[id] = ((carIndex[id]||0) + delta + n) % n;
  var wrap = document.getElementById('car-' + id); if(!wrap) return;
  var imgs = wrap.querySelectorAll('img'); var dots = wrap.querySelectorAll('[data-dot]');
  imgs.forEach(function(img,i){ img.classList.toggle('active', i === carIndex[id]); });
  dots.forEach(function(d,i){ d.classList.toggle('active', i === carIndex[id]); });
}

/* ---- backend ---- */
function apiCall(action, extra){
  var body = Object.assign({ id: SITE_ID, action: action, user: sessionUser, pass: sessionPass }, extra || {});
  return fetch(API_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) })
    .then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); });
}

/* ---- login / hub ---- */
function openAdminLogin(){ document.getElementById('adminLoginModal').classList.add('open'); }
function closeAdminLogin(){ document.getElementById('adminLoginModal').classList.remove('open'); document.getElementById('admErr').style.display = 'none'; document.getElementById('admU').value=''; document.getElementById('admP').value=''; }
function tryAdminLogin(){
  var u = document.getElementById('admU').value.trim();
  var p = document.getElementById('admP').value;
  apiCall('login', { user: u, pass: p }).then(function(res){
    if(res.status === 200 && res.body && res.body.ok){
      sessionUser = u; sessionPass = p;
      remote = res.body.data || {};
      applyData(); renderCatalog();
      closeAdminLogin();
      document.getElementById('hubTitle').textContent = 'Panel de ' + (effective('businessName') || 'tu negocio');
      document.getElementById('adminHubModal').classList.add('open');
    } else {
      document.getElementById('admErr').style.display = 'block';
    }
  });
}
function closeAdminHub(){ sessionUser = null; sessionPass = null; document.getElementById('adminHubModal').classList.remove('open'); }

/* ---- datos del negocio ---- */
function openAdminBiz(){
  document.getElementById('edName').value = effective('businessName') || '';
  document.getElementById('edTagline').value = effective('tagline') || '';
  document.getElementById('edEmail').value = effective('email') || '';
  document.getElementById('edWhats').value = effective('whatsapp') || '';
  document.getElementById('edInsta').value = effective('instagram') || '';
  document.getElementById('edFb').value = effective('facebook') || '';
  document.getElementById('edTiktok').value = effective('tiktok') || '';
  var logo = effective('logo') || '';
  document.getElementById('logoValue').value = logo;
  document.getElementById('edLogoUrl').value = logo.indexOf('data:') === 0 ? '' : logo;
  var prev = document.getElementById('logoPreview');
  if(logo){ prev.src = logo; prev.style.display = 'block'; } else { prev.style.display = 'none'; }
  document.getElementById('adminHubModal').classList.remove('open');
  document.getElementById('adminBizModal').classList.add('open');
}
function closeAdminBiz(){ document.getElementById('adminBizModal').classList.remove('open'); document.getElementById('adminHubModal').classList.add('open'); }
function onLogoUrl(val){ document.getElementById('logoValue').value = val; var p = document.getElementById('logoPreview'); if(val){ p.src = val; p.style.display = 'block'; } else { p.style.display = 'none'; } }
function onLogoFile(input){
  var file = input.files && input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){ document.getElementById('logoValue').value = e.target.result; document.getElementById('edLogoUrl').value = ''; var p = document.getElementById('logoPreview'); p.src = e.target.result; p.style.display = 'block'; };
  reader.readAsDataURL(file);
}
function saveBizEdits(){
  var data = {
    businessName: document.getElementById('edName').value.trim(),
    tagline: document.getElementById('edTagline').value.trim(),
    email: document.getElementById('edEmail').value.trim(),
    whatsapp: document.getElementById('edWhats').value.replace(/\D/g,''),
    instagram: document.getElementById('edInsta').value.replace('@','').trim(),
    facebook: document.getElementById('edFb').value.trim(),
    tiktok: document.getElementById('edTiktok').value.replace('@','').trim(),
    logo: document.getElementById('logoValue').value || ''
  };
  apiCall('save', { data: data }).then(function(res){
    if(res.status === 200 && res.body && res.body.ok){ remote = Object.assign({}, remote, data); applyData(); closeAdminBiz(); alert('Cambios guardados.'); }
    else { alert('No se pudo guardar. Probá de nuevo.'); }
  });
}

/* ---- categorías + catálogo ---- */
function openCatalog(){
  document.getElementById('adminHubModal').classList.remove('open');
  document.getElementById('catalogModal').classList.add('open');
  renderCatManage(); renderProdList();
}
function closeCatalog(){ document.getElementById('catalogModal').classList.remove('open'); document.getElementById('adminHubModal').classList.add('open'); }
function renderCatManage(){
  var cats = effectiveCategories();
  document.getElementById('catManageList').innerHTML = cats.map(function(c){ return '<span>' + c + '</span>'; }).join('');
}
function addCategory(){
  var val = document.getElementById('newCatInput').value.trim();
  if(!val) return;
  var cats = effectiveCategories().slice();
  if(cats.indexOf(val) === -1) cats.push(val);
  apiCall('save', { data: { categories: cats } }).then(function(res){
    if(res.status === 200 && res.body && res.body.ok){ remote.categories = cats; document.getElementById('newCatInput').value = ''; renderCatManage(); renderCatFilter(); }
    else { alert('No se pudo guardar la categoría.'); }
  });
}
function renderProdList(){
  var items = effectiveItems();
  var wrap = document.getElementById('prodList');
  if(!items.length){ wrap.innerHTML = '<p style="color:var(--muted);font-size:13px;">Todavía no cargaste nada.</p>'; return; }
  wrap.innerHTML = items.map(function(it){
    var thumb = (it.images && it.images[0]) ? it.images[0] : '';
    return '<div class="prod-row">' + (thumb ? '<img src="' + thumb.replace(/"/g,'&quot;') + '">' : '<div style="width:44px;height:44px;border-radius:6px;background:#00000015"></div>') +
      '<div class="pr-info"><b>' + escHtml(it.name) + '</b><small>' + (it.category||'Sin categoría') + ' · $' + formatMoney(it.price) + '</small></div>' +
      '<div class="pr-actions"><button onclick="openItemForm(\'' + it.id + '\')">Editar</button><button onclick="deleteItem(\'' + it.id + '\')">Eliminar</button></div></div>';
  }).join('');
}
function populateCatSelect(selected){
  var sel = document.getElementById('itCatSelect');
  var cats = effectiveCategories();
  sel.innerHTML = cats.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('') + '<option value="__new__">+ Nueva categoría...</option>';
  sel.value = (selected && cats.indexOf(selected) !== -1) ? selected : cats[0];
  onItCatChange();
}
function onItCatChange(){
  var sel = document.getElementById('itCatSelect');
  document.getElementById('itNewCatWrap').style.display = sel.value === '__new__' ? 'block' : 'none';
}
function openItemForm(id){
  editingItemId = id;
  var it = id ? effectiveItems().find(function(x){ return x.id === id; }) : null;
  document.getElementById('itemFormTitle').textContent = id ? ('Editar ' + itemLabel()) : ('Nuevo ' + itemLabel());
  document.getElementById('itName').value = it ? it.name : '';
  document.getElementById('itPrice').value = it ? it.price : '';
  document.getElementById('itDesc').value = it ? it.desc : '';
  document.getElementById('itNewCat').value = '';
  populateCatSelect(it ? it.category : null);
  editingImages = (it && it.images) ? it.images.slice() : [];
  renderImgThumbs();
  document.getElementById('catalogModal').classList.remove('open');
  document.getElementById('itemFormModal').classList.add('open');
}
function closeItemForm(){ document.getElementById('itemFormModal').classList.remove('open'); document.getElementById('catalogModal').classList.add('open'); }
function renderImgThumbs(){
  document.getElementById('itImgThumbs').innerHTML = editingImages.map(function(src,i){
    return '<div class="th"><img src="' + src.replace(/"/g,'&quot;') + '"><button onclick="removeImgThumb(' + i + ')">×</button></div>';
  }).join('');
}
function removeImgThumb(i){ editingImages.splice(i,1); renderImgThumbs(); }
function addItemImageUrl(){ var val = document.getElementById('itImgUrl').value.trim(); if(!val) return; editingImages.push(val); document.getElementById('itImgUrl').value = ''; renderImgThumbs(); }
function onItemImageFile(input){
  var file = input.files && input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){ editingImages.push(e.target.result); renderImgThumbs(); };
  reader.readAsDataURL(file);
}
function saveItemForm(){
  var name = document.getElementById('itName').value.trim();
  if(!name){ alert('Poné un nombre.'); return; }
  var sel = document.getElementById('itCatSelect').value;
  var newCat = document.getElementById('itNewCat').value.trim();
  var category = sel === '__new__' ? newCat : sel;
  if(!category){ alert('Elegí o creá una categoría.'); return; }
  var cats = effectiveCategories().slice();
  if(cats.indexOf(category) === -1) cats.push(category);
  var items = effectiveItems().slice();
  var priceVal = Number(document.getElementById('itPrice').value) || 0;
  var descVal = document.getElementById('itDesc').value.trim();
  if(editingItemId){
    items = items.map(function(it){ return it.id === editingItemId ? { id: it.id, name: name, price: priceVal, desc: descVal, category: category, images: editingImages.slice() } : it; });
  } else {
    items.push({ id: 'it_' + Date.now(), name: name, price: priceVal, desc: descVal, category: category, images: editingImages.slice() });
  }
  apiCall('save', { data: { items: items, categories: cats } }).then(function(res){
    if(res.status === 200 && res.body && res.body.ok){
      remote.items = items; remote.categories = cats;
      renderCatalog(); renderProdList(); renderCatManage();
      closeItemForm();
    } else { alert('No se pudo guardar. Probá de nuevo.'); }
  });
}
function deleteItem(id){
  if(!confirm('¿Eliminar este ' + itemLabel() + '?')) return;
  var items = effectiveItems().filter(function(it){ return it.id !== id; });
  apiCall('save', { data: { items: items } }).then(function(res){
    if(res.status === 200 && res.body && res.body.ok){ remote.items = items; renderCatalog(); renderProdList(); }
    else { alert('No se pudo eliminar. Probá de nuevo.'); }
  });
}

init();
</script>
</body>
</html>
